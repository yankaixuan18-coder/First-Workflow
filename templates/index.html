<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amazon 类目研究采集工具</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Segoe UI', system-ui, sans-serif; }
    #logBox {
      font-family: 'Consolas', 'Menlo', monospace;
      font-size: 0.8rem;
      background: #0f172a;
      color: #94a3b8;
      height: 420px;
      overflow-y: auto;
      padding: 12px;
      border-radius: 6px;
      white-space: pre-wrap;
      word-break: break-all;
    }
    #logBox .log-error   { color: #f87171; }
    #logBox .log-success { color: #4ade80; }
    #logBox .log-status  { color: #60a5fa; font-weight: 600; }
    .badge-idle    { background:#e2e8f0; color:#475569; }
    .badge-running { background:#fef3c7; color:#92400e; }
    .badge-done    { background:#dcfce7; color:#166534; }
    .badge-error   { background:#fee2e2; color:#991b1b; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen">

<!-- Header -->
<header class="bg-orange-500 text-white px-6 py-4 shadow-md">
  <div class="max-w-7xl mx-auto flex items-center gap-3">
    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M9 17v-6l-2-2V7a2 2 0 012-2h6a2 2 0 012 2v2l-2 2v6m-6 0h6"/>
    </svg>
    <div>
      <h1 class="text-xl font-bold">Amazon 类目研究采集工具</h1>
      <p class="text-orange-100 text-xs">本地浏览器驱动 · 支持卖家精灵 / SIF 扩展 · 导出 Excel</p>
    </div>
  </div>
</header>

<main class="max-w-7xl mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-2 gap-6">

  <!-- ===== LEFT: Input Form ===== -->
  <section class="bg-white rounded-xl shadow p-6 space-y-5">
    <h2 class="text-lg font-semibold text-slate-700 border-b pb-2">采集参数</h2>

    <div>
      <label class="block text-sm font-medium text-slate-600 mb-1">
        Amazon 关键词 / 类目 URL <span class="text-red-500">*</span>
      </label>
      <input id="kwInput" type="text"
             placeholder="e.g.  camping cot  或  https://www.amazon.com/s?k=..."
             class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-orange-400" />
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-slate-600 mb-1">站点 Marketplace</label>
        <select id="marketplace"
                class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-orange-400">
          {% for key in marketplaces %}
          <option value="{{ key }}" {% if key == 'amazon.com' %}selected{% endif %}>{{ key }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-600 mb-1">最大页数 Max Pages</label>
        <input id="maxPages" type="number" min="1" max="20" value="{{ max_pages_default }}"
               class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-orange-400" />
      </div>
    </div>

    <div>
      <label class="block text-sm font-medium text-slate-600 mb-1">最大商品数 Max Products</label>
      <input id="maxProducts" type="number" min="1" max="500" value="{{ max_products_default }}"
             class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-orange-400" />
    </div>

    <div class="flex items-center gap-2">
      <input id="fetchDetails" type="checkbox"
             class="h-4 w-4 text-orange-500 border-slate-300 rounded" />
      <label for="fetchDetails" class="text-sm text-slate-600">
        同时打开详情页 (较慢，获取更多数据 / Opens detail pages — slower but richer data)
      </label>
    </div>

    <details class="border border-slate-200 rounded-lg">
      <summary class="px-4 py-2 text-sm font-medium text-slate-600 cursor-pointer select-none hover:bg-slate-50">
        Chrome 设置 (高级) ▾
      </summary>
      <div class="px-4 pb-4 pt-2 space-y-3">
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1">
            Chrome 用户数据目录 User Data Dir
          </label>
          <input id="chromeDir" type="text" value="{{ default_chrome_dir }}"
                 class="w-full border border-slate-300 rounded px-2 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-orange-400" />
          <p class="text-xs text-slate-400 mt-1">
            Windows: C:\Users\YourName\AppData\Local\Google\Chrome\User Data
          </p>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1">
            Chrome 配置文件 Profile Name
          </label>
          <input id="chromeProfile" type="text" value="{{ default_profile }}"
                 class="w-full border border-slate-300 rounded px-2 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-orange-400" />
        </div>
        <p class="text-xs text-amber-600">
          ⚠ 运行前请完全关闭 Chrome 浏览器，否则配置文件会被锁定。<br />
          Close all Chrome windows before starting — Chrome cannot share a profile with another process.
        </p>
      </div>
    </details>

    <button id="startBtn" onclick="startCollection()"
            class="w-full bg-orange-500 hover:bg-orange-600 active:bg-orange-700 text-white font-semibold
                   py-3 rounded-xl shadow transition-colors text-base tracking-wide">
      🚀 开始采集
    </button>
  </section>

  <!-- ===== RIGHT: Progress & Results ===== -->
  <section class="bg-white rounded-xl shadow p-6 space-y-4 flex flex-col">
    <div class="flex items-center justify-between border-b pb-2">
      <h2 class="text-lg font-semibold text-slate-700">采集进度</h2>
      <div class="flex items-center gap-3">
        <span id="productCount" class="text-sm text-slate-500"></span>
        <span id="statusBadge"
              class="badge-idle text-xs font-semibold px-2.5 py-1 rounded-full">
          待机 Idle
        </span>
      </div>
    </div>

    <!-- Log output -->
    <div id="logBox" class="flex-1"></div>

    <!-- Download button (hidden until done) -->
    <div id="downloadSection" class="hidden">
      <a id="downloadBtn" href="#"
         class="flex items-center justify-center gap-2 w-full bg-green-500 hover:bg-green-600
                text-white font-semibold py-3 rounded-xl shadow transition-colors text-base">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M7 10l5 5 5-5M12 15V3"/>
        </svg>
        下载 Excel
      </a>
    </div>

    <!-- Error message -->
    <div id="errorMsg" class="hidden bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg px-4 py-3"></div>
  </section>

</main>

<script src="/static/app.js"></script>
</body>
</html>
